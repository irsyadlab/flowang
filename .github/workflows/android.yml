name: Android TWA Build

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-read-only: false

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restore android.keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
        working-directory: android

      - name: Restore keystore.json
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_JSON }}' > keystore.json
        working-directory: android

      - name: Build TWA (for Play Store)
        run: |
          bubblewrap build --skipPwaValidation \
            --signingKeyPath android.keystore \
            --signingKeyStorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --signingKeyAliasPassword "${{ secrets.KEY_PASSWORD }}" \
            --jdkPath "$JAVA_HOME_17_X64" \
            --androidSdkPath "$ANDROID_HOME" \
            --target AAB
        working-directory: android

      - name: Build TWA (APK for Sideload/Testing)
        run: |
          bubblewrap build --skipPwaValidation \
            --signingKeyPath android.keystore \
            --signingKeyStorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --signingKeyAliasPassword "${{ secrets.KEY_PASSWORD }}" \
            --jdkPath "$JAVA_HOME_17_X64" \
            --androidSdkPath "$ANDROID_HOME" \
            --target APK
        working-directory: android

      - name: Upload Artifacts ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: flowang-twa-builds
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
