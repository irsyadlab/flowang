name: Android TWA Build

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-read-only: false

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore
        working-directory: android

      - name: Restore keystore.json
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_JSON }}' > android/keystore.json
        working-directory: android

      - name: Build TWA
        run: bubblewrap build --skipPwaValidation
        working-directory: android

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowang-release-aab
          path: android/app-release-signed.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app-release-signed.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
